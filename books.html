{% extends 'base.html' %}{% block content %}
<div class="row g-4"><div class="col-lg-4"><div class="card shadow-sm border-0"><div class="card-body"><h2 class="h4">Add book</h2><form method="post"><input class="form-control mb-2" name="title" placeholder="Book title" required><input class="form-control mb-2" name="author" placeholder="Author" required><input class="form-control mb-2" name="isbn" placeholder="ISBN" required><input class="form-control mb-2" name="category" placeholder="Category" required><input type="number" min="1" class="form-control mb-3" name="total_copies" placeholder="Total copies" required><button class="btn btn-primary w-100">Add book</button></form></div></div></div><div class="col-lg-8"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2 mb-0">Books</h1><form class="d-flex"><input class="form-control" name="search" value="{{ search }}" placeholder="Search books"><button class="btn btn-outline-primary ms-2">Search</button></form></div><div class="card shadow-sm border-0 table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Title</th><th>Category</th><th>ISBN</th><th>Available</th><th></th></tr></thead><tbody>{% for book in books %}<tr><td><strong>{{ book.title }}</strong><br><small class="text-muted">{{ book.author }}</small></td><td>{{ book.category }}</td><td>{{ book.isbn }}</td><td><span class="badge text-bg-{{ 'success' if book.available_copies else 'secondary' }}">{{ book.available_copies }}/{{ book.total_copies }}</span></td><td><form method="post" action="{{ url_for('delete_book', book_id=book.id) }}" onsubmit="return confirm('Remove this book?')"><button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted py-4">No books found.</td></tr>{% endfor %}</tbody></table></div></div></div>
{% endblock %}
