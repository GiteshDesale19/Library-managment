{% extends 'base.html' %}{% block content %}
<div class="row g-4"><div class="col-lg-4"><div class="card shadow-sm border-0"><div class="card-body"><h2 class="h4">Register member</h2><form method="post"><input class="form-control mb-2" name="name" placeholder="Full name" required><input type="email" class="form-control mb-2" name="email" placeholder="Email address" required><input class="form-control mb-3" name="phone" placeholder="Phone number" required><button class="btn btn-primary w-100">Register member</button></form></div></div></div><div class="col-lg-8"><h1 class="h2 mb-3">Members</h1><div class="card shadow-sm border-0 table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th></th></tr></thead><tbody>{% for member in members %}<tr><td><strong>{{ member.name }}</strong></td><td>{{ member.email }}</td><td>{{ member.phone }}</td><td>{{ member.joined_at.strftime('%d %b %Y') }}</td><td><form method="post" action="{{ url_for('delete_member', member_id=member.id) }}" onsubmit="return confirm('Remove this member?')"><button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted py-4">No members registered.</td></tr>{% endfor %}</tbody></table></div></div></div>
{% endblock %}
