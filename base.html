<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LibraryHub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('librarian') %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container">
  <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">📚 LibraryHub</a>
  <div class="navbar-nav ms-auto"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a><a class="nav-link" href="{{ url_for('books') }}">Books</a><a class="nav-link" href="{{ url_for('members') }}">Members</a><a class="nav-link" href="{{ url_for('loans') }}">Issue / Return</a><a class="nav-link" href="{{ url_for('history') }}">History</a><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></div>
</div></nav>
{% endif %}
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
